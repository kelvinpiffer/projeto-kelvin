<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0d1c">
<title>Luana Hellcat</title>
<link rel="icon" href="img/avatar.webp">
<link rel="preload" as="image" href="img/card.webp">
<style>
:root{
  --bg:#0a0d1c;
  --bg-2:#121733;
  --line:rgba(255,255,255,.09);
  --orange:#ff6b1a;
  --orange-2:#ff8c3a;
  --orange-d:#c94a06;
  --blue:#3d4bff;
  --ink:#f3f4fb;
  --muted:#8e93b5;
  --ok:#2ee36f;
  --tg:#2aa3e0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(120% 60% at 100% 0%,rgba(61,75,255,.22),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(255,107,26,.14),transparent 60%);background-attachment:fixed}
img{display:block;max-width:100%}
button{font:inherit;border:0;cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:440px;margin:0 auto}
.vf{width:18px;height:18px;flex:none}

/* ========== TELA 1 ========== */
#s1{position:relative;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  padding:0 18px max(18px,env(safe-area-inset-bottom))}
.hero{position:absolute;inset:0;background:#1a1f3d center 30%/cover no-repeat}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,13,28,.55) 0%,rgba(10,13,28,0) 22%,rgba(10,13,28,0) 42%,rgba(10,13,28,.85) 66%,var(--bg) 82%)}
.bar{position:absolute;left:18px;right:18px;top:max(14px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;z-index:2}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:rgba(10,13,28,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(46,227,111,.25);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.chip--18{background:var(--orange);border-color:transparent;font-weight:900}
.gate{position:relative;z-index:2;text-align:center}
.kicker{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;color:var(--orange-2)}
.kicker::before,.kicker::after{content:'';width:18px;height:2px;background:currentColor;border-radius:2px}
.gname{display:flex;align-items:center;justify-content:center;gap:7px;font-size:30px;font-weight:900;letter-spacing:-.5px;margin-top:6px}
.gname .vf{width:22px;height:22px}
.q{font-size:18px;font-weight:700;margin-top:8px;color:#d9dcf2}
.q span{color:var(--orange-2)}
.duo{display:flex;gap:12px;margin-top:18px}
.btn{flex:1;height:62px;border-radius:16px;font-size:20px;font-weight:900;letter-spacing:1.5px;color:#fff;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn--a{background:linear-gradient(180deg,var(--orange-2),var(--orange));box-shadow:0 10px 28px rgba(255,107,26,.45),inset 0 1px 0 rgba(255,255,255,.35);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.btn--b{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.legal{font-size:11px;color:var(--muted);margin-top:14px}

/* ========== TELA 2 ========== */
#s2{animation:fade .35s ease both;padding-bottom:max(24px,env(safe-area-inset-bottom))}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cover{height:210px;background:#1a1f3d center 70%/cover no-repeat;clip-path:polygon(0 0,100% 0,100% 78%,0 100%);position:relative}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,13,28,0) 50%,rgba(10,13,28,.6))}
.head{padding:0 18px;margin-top:-58px;position:relative;display:flex;align-items:flex-end;gap:14px}
.av{position:relative;width:104px;height:104px;flex:none;border-radius:30px;padding:3px;background:linear-gradient(135deg,var(--orange-2),var(--blue))}
.av div{width:100%;height:100%;border-radius:27px;background:#1a1f3d center/cover;border:3px solid var(--bg)}
.av em{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:10px;font-weight:900;letter-spacing:.5px;background:var(--ok);color:#06210f;padding:3px 7px;border-radius:999px;border:3px solid var(--bg)}
.stats{display:flex;gap:16px;padding-bottom:6px}
.stats b{display:block;font-size:17px;font-weight:900}
.stats span{font-size:11px;color:var(--muted)}
.idt{padding:12px 18px 0}
.name{display:flex;align-items:center;gap:6px;font-size:24px;font-weight:900;letter-spacing:-.3px}
.handle{font-size:13px;color:var(--muted);margin-top:1px}
.bio{font-size:14.5px;line-height:1.4;margin-top:8px;color:#d9dcf2}

.timer{margin:16px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 14px;border-radius:16px;
  background:linear-gradient(90deg,rgba(255,107,26,.16),rgba(255,107,26,.04));border:1px solid rgba(255,107,26,.35)}
.timer p{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--orange-2);line-height:1.25}
.timer p small{display:block;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.digits{display:flex;align-items:center;gap:4px}
.digits b{min-width:38px;text-align:center;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 4px}
.digits i{font-style:normal;font-weight:900;color:var(--orange)}

.ctas{display:flex;flex-direction:column;gap:14px;margin:18px 18px 0}
.cta{position:relative;display:flex;align-items:center;gap:14px;min-height:70px;padding:12px 16px 12px 12px;border-radius:20px;text-decoration:none;color:#fff;transition:transform .1s;overflow:hidden}
.cta:active{transform:scale(.97)}
.cta .ico{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center}
.cta .txt{flex:1;min-width:0}
.cta .txt strong{display:block;font-size:17px;font-weight:900;line-height:1.15}
.cta .txt span{display:block;font-size:12.5px;opacity:.85;margin-top:2px}
.cta .arr{width:22px;height:22px;flex:none;opacity:.9}
.cta small{position:absolute;top:0;right:0;font-size:10px;font-weight:900;letter-spacing:.8px;padding:5px 12px 5px 14px;border-radius:0 0 0 14px}
.cta i.shine{position:absolute;inset:0;pointer-events:none}
.cta i.shine::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.cta--privacy{background:linear-gradient(120deg,var(--orange-2),var(--orange) 55%,var(--orange-d));box-shadow:0 12px 30px rgba(255,107,26,.4);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 8px 20px rgba(255,107,26,.3)}50%{box-shadow:0 12px 38px rgba(255,107,26,.7)}}
.cta--privacy .ico{background:#141110}
.cta--privacy .ico img{width:30px;height:30px}
.cta--privacy .pv-logo{height:19px;width:auto;margin-bottom:3px}
.cta--privacy small{background:#141110;color:var(--orange-2)}
.cta--tg{background:var(--bg-2);border:1px solid rgba(42,163,224,.45)}
.cta--tg .ico{background:var(--tg)}
.cta--tg small{background:var(--tg);color:#fff}
.safe{text-align:center;font-size:11.5px;color:var(--muted);margin-top:12px}

.sec{margin:26px 18px 0}
.sec h3{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.perk{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.perk div{font-size:22px}
.perk p{font-size:11.5px;line-height:1.25;margin-top:6px;color:#d9dcf2}

.chat{background:var(--bg-2);border:1px solid var(--line);border-radius:20px;padding:14px;min-height:92px}
.msg{display:flex;gap:10px;align-items:flex-end;transition:opacity .3s,transform .3s}
.msg.out{opacity:0;transform:translateY(8px)}
.msg .rv-av{width:34px;height:34px;flex:none;border-radius:12px;background:linear-gradient(135deg,var(--blue),#7a5cff);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.bubble{flex:1;min-width:0;background:rgba(255,255,255,.06);border-radius:16px 16px 16px 4px;padding:9px 12px}
.bubble .top{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800}
.bubble .top em{font-style:normal;color:#ffb02e;letter-spacing:1px;font-size:11px}
.bubble .top small{margin-left:auto;font-weight:500;color:var(--muted)}
.bubble p{font-size:14px;line-height:1.3;margin-top:3px}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:24px}

@media (max-height:640px){
  .gname{font-size:26px}
  .btn{height:56px;font-size:18px}
  .cover{height:170px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ TELA 1 ============ -->
<main id="s1" class="wrap">
  <div class="hero" id="hero"></div>
  <div class="bar">
    <div class="chip"><i></i>Online agora</div>
    <div class="chip chip--18">+18</div>
  </div>
  <section class="gate">
    <span class="kicker" id="kicker"></span>
    <h1 class="gname"><span id="n1"></span>
      <svg class="vf" viewBox="0 0 24 24"><path fill="#ff6b1a" d="M12 1l2.6 2.2 3.4-.4.9 3.3 3 1.7-1.1 3.2 1.1 3.2-3 1.7-.9 3.3-3.4-.4L12 23l-2.6-2.2-3.4.4-.9-3.3-3-1.7L3.2 13 2.1 9.8l3-1.7.9-3.3 3.4.4z"/><path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M7.5 12.3l3 3 6-6"/></svg>
    </h1>
    <p class="q" id="q"></p>
    <div class="duo">
      <button class="btn btn--a" id="b1" type="button"></button>
      <button class="btn btn--b" id="b2" type="button"></button>
    </div>
    <p class="legal">Conteúdo exclusivo para maiores de 18 anos</p>
  </section>
</main>

<!-- ============ TELA 2 ============ -->
<main id="s2" class="wrap hidden">
  <div class="cover" id="cover"></div>
  <div class="head">
    <div class="av"><div id="av"></div><em>ON</em></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="idt">
    <h2 class="name"><span id="n2"></span>
      <svg class="vf" viewBox="0 0 24 24"><path fill="#ff6b1a" d="M12 1l2.6 2.2 3.4-.4.9 3.3 3 1.7-1.1 3.2 1.1 3.2-3 1.7-.9 3.3-3.4-.4L12 23l-2.6-2.2-3.4.4-.9-3.3-3-1.7L3.2 13 2.1 9.8l3-1.7.9-3.3 3.4.4z"/><path fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M7.5 12.3l3 3 6-6"/></svg>
    </h2>
    <div class="handle" id="handle"></div>
    <p class="bio" id="bio"></p>
  </div>

  <div class="timer">
    <p>🔥 Oferta liberada<small>só para quem chegou agora</small></p>
    <div class="digits"><b id="cdM">00</b><i>:</i><b id="cdS">00</b></div>
  </div>

  <nav class="ctas" id="ctas"></nav>
  <p class="safe">🔒 Pagamento seguro e discreto · acesso imediato</p>

  <section class="sec">
    <h3>O que te espera</h3>
    <div class="perks" id="perks"></div>
  </section>

  <section class="sec">
    <h3>Quem já assinou</h3>
    <div class="chat">
      <div class="msg" id="review">
        <div class="rv-av" id="rvAv"></div>
        <div class="bubble">
          <div class="top"><span id="rvName"></span><em>★★★★★</em><small id="rvTime"></small></div>
          <p id="rvText"></p>
        </div>
      </div>
    </div>
  </section>
  <p class="foot">Conteúdo exclusivo para maiores de 18 anos</p>
</main>

<script>
(function(){
/* ================= CONTEÚDO — EDITE AQUI ================= */
var C = {
  name:     'Luana Hellcat',
  handle:   '@luanahellcat',
  kicker:   'perfil verificado',
  question: 'Quer ver o que eu <span>não posto em lugar nenhum?</span>',
  btn1:     'QUERO',
  btn2:     'SIM',
  bio:      'Fitness, velocidade e zero filtro 🏁 O que não cabe no Instagram tá tudo aqui 😈',
  stats:    [['480','fotos'],['120','vídeos'],['4.9★','nota']],
  card:     'img/card.webp',
  cover:    'img/capa.webp',
  avatar:   'img/avatar.webp',
  countdownMinutes: 10,

  links: [
    { id: 'privacy', type: 'privacy', label: 'Privacy',   sub: 'Todos os meus conteúdos liberados', badge: 'PROMO', url: 'https://privacy.com.br/profile/luanahellcat' },
    { id: 'vip',     type: 'tg',      label: 'Telegram VIP', sub: 'Conteúdo exclusivo + chat comigo', badge: 'VIP', url: 'https://t.me/luanahellcatbot' }
  ],

  perks: [['📸','Fotos e vídeos inéditos'],['🔥','Novidade toda semana'],['💬','Fala direto comigo']],

  reviews: [
    { n: 'Gustavo F.', t: 'há 3 min',  x: 'Muito melhor do que eu esperava 🔥' },
    { n: 'Rodrigo L.', t: 'há 7 min',  x: 'Ela responde mesmo no Telegram, top demais 😍' },
    { n: 'Felipe C.',  t: 'há 12 min', x: 'Conteúdo novo toda semana, vale muito' },
    { n: 'André M.',   t: 'há 18 min', x: 'Entrei pela promo e já virei fã 🤤' },
    { n: 'Caio R.',    t: 'há 26 min', x: 'Os vídeos são outro nível 🙈' }
  ]
};
/* ========================================================= */

var $ = function(id){ return document.getElementById(id); };
var qs = location.search.slice(1);
function withParams(u){ return qs ? u + (u.indexOf('?') > -1 ? '&' : '?') + qs : u; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

/* Tela 1 */
$('hero').style.backgroundImage = 'url(' + C.card + ')';
$('kicker').textContent = C.kicker;
$('n1').textContent = C.name;
$('q').innerHTML = C.question;
$('b1').textContent = C.btn1;
$('b2').textContent = C.btn2;

window.addEventListener('load', function(){ [C.cover, C.avatar, 'img/privacy-icon.webp', 'img/privacy-logo.svg'].forEach(function(s){ new Image().src = s; }); });

var arrow = '<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
var icons = {
  privacy: '<span class="ico"><img src="img/privacy-icon.webp" alt=""></span>',
  tg:      '<span class="ico"><svg width="28" height="28" viewBox="0 0 24 24"><path fill="#fff" d="M2.6 11.2l17.1-6.6c.8-.3 1.5.2 1.2 1.4l-2.9 13.8c-.2 1-.8 1.2-1.6.7l-4.5-3.3-2.2 2.1c-.2.2-.5.4-.9.4l.3-4.6 8.4-7.6c.4-.3-.1-.5-.6-.2L6.9 13.9l-4.5-1.4c-1-.3-1-1 .2-1.3z"/></svg></span>'
};

var built = false;
function build(){
  if (built) return; built = true;
  $('cover').style.backgroundImage = 'url(' + C.cover + ')';
  $('av').style.backgroundImage = 'url(' + C.avatar + ')';
  $('n2').textContent = C.name;
  $('handle').textContent = C.handle;
  $('bio').textContent = C.bio;
  $('stats').innerHTML = C.stats.map(function(s){ return '<div><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>'; }).join('');
  $('perks').innerHTML = C.perks.map(function(p){ return '<div class="perk"><div>' + p[0] + '</div><p>' + esc(p[1]) + '</p></div>'; }).join('');

  C.links.forEach(function(l){
    var a = document.createElement('a');
    a.className = 'cta cta--' + l.type;
    a.href = withParams(l.url); a.target = '_blank'; a.rel = 'noopener';
    a.setAttribute('aria-label', l.label);
    var title = l.type === 'privacy' ? '<img class="pv-logo" src="img/privacy-logo.svg" alt="Privacy">' : '<strong>' + esc(l.label) + '</strong>';
    a.innerHTML = '<i class="shine"></i>' + (icons[l.type] || '') + '<span class="txt">' + title + '<span>' + esc(l.sub) + '</span></span>' + arrow + (l.badge ? '<small>' + esc(l.badge) + '</small>' : '');
    $('ctas').appendChild(a);
  });

  /* cronômetro por visitante */
  var KEY = 'due_' + C.handle, due = 0, now = Date.now();
  try { due = +localStorage.getItem(KEY) || 0; } catch(e){}
  if (due <= now) { due = now + C.countdownMinutes * 60000; try { localStorage.setItem(KEY, due); } catch(e){} }
  function p(n){ return (n < 10 ? '0' : '') + n; }
  function tick(){
    var s = Math.floor((due - Date.now()) / 1000);
    if (s <= 0) { due = Date.now() + C.countdownMinutes * 60000; try { localStorage.setItem(KEY, due); } catch(e){} s = C.countdownMinutes * 60; }
    $('cdM').textContent = p(Math.floor(s / 60));
    $('cdS').textContent = p(s % 60);
  }
  tick(); setInterval(tick, 1000);

  /* prova social */
  var i = 0, box = $('review');
  function show(){
    var r = C.reviews[i++ % C.reviews.length];
    $('rvAv').textContent = r.n.charAt(0);
    $('rvName').textContent = r.n;
    $('rvTime').textContent = r.t;
    $('rvText').textContent = r.x;
  }
  show();
  setInterval(function(){ box.classList.add('out'); setTimeout(function(){ show(); box.classList.remove('out'); }, 300); }, 4000);
}

function go(push){
  build();
  $('s1').classList.add('hidden');
  $('s2').classList.remove('hidden');
  window.scrollTo(0, 0);
  if (push && !(history.state && history.state.s === 2)) history.pushState({ s: 2 }, '');
}
$('b1').addEventListener('click', function(){ go(true); });
$('b2').addEventListener('click', function(){ go(true); });
window.addEventListener('popstate', function(e){
  if (e.state && e.state.s === 2) go(false);
  else { $('s2').classList.add('hidden'); $('s1').classList.remove('hidden'); }
});
if (history.state && history.state.s === 2) go(false);
})();
</script>
</body>
</html>
